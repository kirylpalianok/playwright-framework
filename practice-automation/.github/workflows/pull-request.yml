name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  smoke:
    name: Typecheck and smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npx playwright test --grep @smoke --project=chromium

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      # Runs after a failed suite as well, because that is when the report matters most.
      # Guarded on results actually existing so an earlier setup failure surfaces as its
      # own error rather than as a confusing "allure generate" failure. This step cannot
      # mask a failing suite: the smoke step's failure has already failed the job.
      - name: Generate Allure report
        if: ${{ !cancelled() && hashFiles('allure-results/**') != '' }}
        run: npm run report:generate

      - name: Upload Allure report
        if: ${{ !cancelled() && hashFiles('allure-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
